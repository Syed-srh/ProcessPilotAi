services:
  - type: web
    name: processpilot-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run prisma:generate --workspace=server && npm run build:server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
